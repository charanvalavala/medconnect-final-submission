name: MedConnect verification
on:
  push:
  pull_request:

jobs:
  database-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medconnect
          POSTGRES_PASSWORD: medconnect
          POSTGRES_DB: medconnect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medconnect -d medconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://medconnect:medconnect@localhost:5432/medconnect_test
      TEST_DATABASE_URL: postgresql://medconnect:medconnect@localhost:5432/medconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-dev.txt -c backend/requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/bootstrap.py
      - run: python scripts/bootstrap.py
      - run: python scripts/verify_db.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
